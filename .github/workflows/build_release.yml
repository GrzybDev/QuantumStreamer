name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_type:
        type: choice
        description: 'Version Type'
        required: true
        default: rebuild
        options:
          - rebuild
          - patch
          - minor
          - major

jobs:
  version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - id: bump
        uses: GrzybDev/actions/bump-version@v1
        with:
          bump: ${{ inputs.version_type }}

  build:
    name: Build
    needs: version
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    # The signing machine never signs a file uploaded longer ago, so the two change together.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Integrate vcpkg
        run: vcpkg integrate install

      - name: Build
        run: msbuild ${{ github.event.repository.name }}.sln -property:Configuration=Release

      - name: Test
        run: ./x64/Release/QuantumStreamer.Tests.exe

      - name: Sign the library
        uses: GrzybDev/actions/codesign@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        with:
          files: x64/Release/loc_x64_f.dll
          version: ${{ needs.version.outputs.version }}
          store: ${{ vars.SIGNING_STORE || 's3://codesign' }}
          subject: ${{ vars.SIGNING_SUBJECT }}

      - name: Attach the library to the release
        uses: softprops/action-gh-release@v3
        with:
          files: x64/Release/loc_x64_f.dll
          tag_name: v${{ needs.version.outputs.version }}
